# Regles de mecanique trade-up CS2, versionnees separement du code.
# Ne rien modifier ici sans verification aupres des patch notes officiels Valve.
#
# Contrat standard (input_count=10, ci-dessous) verifie le 18/09/2026 aupres
# de steamdb.com/en/articles/cs2-trade-up-contract-guide : nombre d'items,
# regle de collection (chaque collection representee doit deja contenir un
# item a la rarete cible), tirage de la collection puis du skin de sortie,
# et formule du float (normaliser/moyenner/remapper) correspondent tous a
# ce qui est implemente dans engine/tradeup.py.
#
# Deux ecarts connus, NON implementes volontairement (pas de source
# primaire Valve croisee, mieux vaut ne pas calculer plutot que calculer
# faux) :
# - Depuis le 22/05/2026, un skin Souvenir peut entrer dans un contrat
#   standard (il perd ses attributs Souvenir, compte une rarete au-dessus
#   des autres inputs). engine/recommend.py exclut deliberement les
#   Souvenir de tout regroupement trade-up ; ils restent valorises
#   correctement (prix Souvenir) mais jamais proposes en TRADE_UP.
# - Depuis le 22/10/2025, un contrat 5x Covert -> 1 couteau/gants
#   ("Exceedingly Rare") existe. Non implemente : input_count fixe a 10,
#   aucune donnee de reference pour les couteaux/gants par collection.
trade_up:
  input_count: 10
  same_rarity_required: true
  same_category_required: true # normal ou stattrak, jamais mixe
  collection_mixing_allowed: true
  # Frais moyen approximatif applique a la vente eventuelle du skin obtenu.
  # A ajuster : varie selon la marketplace et le palier de commission.
  marketplace_fee_rate: 0.12

# Noms exacts tels que retournes par refdata (ByMykel/CSGO-API), du plus
# commun au plus rare. Contraband (ex: M4A4 | Howl) volontairement absent :
# non atteignable par trade-up.
rarities_ascending:
  - Consumer Grade
  - Industrial Grade
  - Mil-Spec Grade
  - Restricted
  - Classified
  - Covert

# Categories d'armes eligibles au trade-up standard. Les couteaux et gants
# partagent des noms de rarete avec les armes (ex "Covert") mais ne
# participent jamais a un trade-up contract.
tradeable_weapon_categories:
  - Pistols
  - SMGs
  - Rifles
  - Heavy

wear_ranges:
  Factory New: [0.00, 0.07]
  Minimal Wear: [0.07, 0.15]
  Field-Tested: [0.15, 0.38]
  Well-Worn: [0.38, 0.45]
  Battle-Scarred: [0.45, 1.00]
