[project]
name = "cs2trade-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "aiosqlite>=0.20",
]

[tool.setuptools]
py-modules = ["main", "dependencies", "inventory_import"]

[tool.setuptools.packages.find]
include = [
    "engine*",
    "pricing*",
    "refdata*",
    "auth*",
    "routers*",
    "llm*",
    "db*",
    "steam*",
    "scripts*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["engine", "pricing", "refdata", "auth", "routers", "llm", "db", "steam"]

[[tool.importlinter.contracts]]
name = "engine never imports llm"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["llm"]
